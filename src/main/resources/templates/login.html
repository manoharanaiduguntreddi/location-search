<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f8ff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            width: 100%;
            background: #003366;
            color: white;
            padding: 15px;
            text-align: center;
        }
        main {
            margin-top: 50px;
            width: 100%;
            max-width: 400px;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin: 10px 0 5px;
            font-weight: bold;
            text-align: left;
        }
        input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            margin-top: 20px;
            padding: 10px;
            background: #003366;
            color: white;
            font-size: 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #0055a5;
        }
        .message {
            margin-top: 15px;
            font-size: 0.9em;
            color: red;
            text-align: center;
        }
    </style>
</head>
<body>
<header>
    <h1>Location Search App</h1>
</header>

<main>
    <h2 style="text-align: center;">Login</h2>
    <form th:action="@{/login}" method="post">
        <label for="username">Username:</label>
        <input type="text" name="username" id="username" autofocus required/>

        <label for="password">Password:</label>
        <input type="password" name="password" id="password" required/>

        <button type="submit">Login</button>

        <!-- Error message -->
        <div th:if="${param.error}" class="message">
            Invalid username or password. Please try again.
        </div>

        <!-- Logout message -->
        <div th:if="${param.logout}" class="message" style="color: green;">
            You have been successfully logged out.
        </div>
    </form>
</main>
</body>
</html>
